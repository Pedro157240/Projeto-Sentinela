<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Triagem</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<button class="btn-sair" onclick="sair()">← Sair</button>
<div class="container">
  <!-- Cabeçalho com botão da TV -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="margin:0;">Triagem Hospitalar</h2>
    <button class="btn-abrir-tv" onclick="window.open('tv.html','_blank')">📺 Abrir Tela da TV</button>
  </div>
  <!-- Fila de pacientes do Atendimento criada para mostrar quem pode ser chamado na TV -->
  <div class="pacientes-fila">
    <h3>
      Pacientes Cadastrados no Atendimento
      <span>Clique em "Chamar na TV" para chamar ao guichê</span>
    </h3>
    <div id="fila-pacientes">
      <p style="color:#888; text-align:center;">Carregando...</p>
    </div>
    <button onclick="carregarPacientes()" style="margin-top:8px; background:#6c757d; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px;">🔄 Atualizar lista</button>
  </div>
  <hr>
  <h3>Formulário de Triagem</h3>
  <input id="nome" placeholder="Nome do paciente">
  <select id="sintoma">
    <option value="">Selecione o sintoma</option>
    <option value="dor_leve">Dor leve</option>
    <option value="resfriado">Resfriado</option>
    <option value="coriza">Coriza</option>
    <option value="tosse">Tosse</option>
    <option value="febre">Febre</option>
    <option value="vomito">Vômito</option>
    <option value="diarreia">Diarreia</option>
    <option value="falta_ar_moderada">Falta de ar moderada</option>
    <option value="falta_ar_grave">Falta de ar grave</option>
    <option value="infarto">Suspeita de infarto</option>
    <option value="avc">Suspeita de AVC</option>
    <option value="convulsao">Convulsão</option>
    <option value="hemorragia">Hemorragia</option>
  </select>
  <input id="temp" type="number" placeholder="Temperatura">
  <input id="alergia" placeholder="Alergias">
  <textarea id="observacao" placeholder="Observações"></textarea>
  <div id="resultado"></div>
  <button onclick="salvar()">Salvar Triagem</button>
</div>
<script>
let pacienteSelecionadoId = null;
function carregarPacientes() {
  fetch("/pacientes")
    .then(r => r.json())
    .then(pacientes => {
      const div = document.getElementById("fila-pacientes");

      // Mostra apenas os com status "triagem"
      const fila = pacientes.filter(p => p.status === "triagem");

      if (fila.length === 0) {
        div.innerHTML = "<p style='color:#888; text-align:center;'>Nenhum paciente aguardando.</p>";
        return;
      }
      div.innerHTML = "";
fila.forEach(p => {
  const item = document.createElement("div");
  item.className = "fila-item";

  item.innerHTML = `
    <div>
      <strong>${p.nome}</strong><br>
      <small>CPF: ${p.cpf || "—"} | Tipo: ${p.tipo || "—"}</small>
    </div>

    <div style="display:flex; gap:8px;">

      <button
        type="button"
        onclick="selecionarPaciente(${p.id}, '${p.nome.replace(/'/g, "\\'")}')"
      >
        Selecionar
      </button>

      <button
        type="button"
        class="btn-tv"
        onclick="chamarNaTV('${p.nome.replace(/'/g, "\\'")}')"
      >
        📺 Chamar na TV
      </button>

    </div>
  `;

  div.appendChild(item);
});

    })
    .catch(() => {
      document.getElementById("fila-pacientes").innerHTML =
        "<p style='color:red;'>Erro ao carregar pacientes.</p>";
    });
}

function selecionarPaciente(id, nome) {

  pacienteSelecionadoId = id;

  document.getElementById("nome").value = nome;

  document.getElementById("resultado").innerHTML =
    "Paciente selecionado: <strong>" + nome + "</strong>";

  document.getElementById("resultado").className = "";

}

// Função criada para enviar o nome do paciente para a TV quando ele for chamado no guichê.
function chamarNaTV(nome) {
  fetch("/tv/chamar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      localTipo: "Guichê",
      localNumero: "01",
      paciente: nome
    })
  })
  .then(r => r.json())
  .then(() => {
    alert("✅ " + nome + " foi chamado na TV para o Guichê 01!");
  });
}
function classificarRisco(sintoma, temperatura) {
  const vermelhos = ["infarto","avc","convulsao","hemorragia","falta_ar_grave"];
  const amarelos = ["febre","vomito","diarreia","falta_ar_moderada"];
  if (temperatura >= 39) return "vermelho";
  if (vermelhos.includes(sintoma)) return "vermelho";
  if (amarelos.includes(sintoma)) return "amarelo";
  return "verde";
}
function salvar() {

  if (!pacienteSelecionadoId) {

    alert("Selecione um paciente da fila antes de salvar a triagem.");

    return;
  }

  const nome =
    document.getElementById("nome").value;

  const sintoma =
    document.getElementById("sintoma").value;

  const temperatura =
    Number(document.getElementById("temp").value);

  const alergia =
    document.getElementById("alergia").value;

  const observacao =
    document.getElementById("observacao").value;

  if (!sintoma) {

    alert("Selecione o sintoma.");

    return;
  }

  const risco =
    classificarRisco(
      sintoma,
      temperatura
    );

  fetch("/triagem", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      pacienteId:
        pacienteSelecionadoId,

      nome:
        nome,

      sintoma:
        sintoma,

      temperatura:
        temperatura,

      alergia:
        alergia,

      observacao:
        observacao,

      risco:
        risco

    })

  })

  .then(async r => {

    const data = await r.json();

    if (!r.ok) {

      throw new Error(
        data.erro ||
        "Erro ao salvar triagem."
      );

    }

    return data;

  })

  .then(data => {

    const resultado =
      document.getElementById("resultado");

    resultado.className =
      data.triagem.risco;

    resultado.innerHTML =
      "Classificação: " +
      data.triagem.risco.toUpperCase();

    alert(
      "✅ Triagem salva com sucesso!"
    );

    /*
     * Limpa o formulário
     */

    document.getElementById("nome").value = "";

    document.getElementById("sintoma").value = "";

    document.getElementById("temp").value = "";

    document.getElementById("alergia").value = "";

    document.getElementById("observacao").value = "";

    /*
     * Esquece o paciente selecionado
     */

    pacienteSelecionadoId = null;

    /*
     * Atualiza a fila.
     *
     * O paciente agora está com status
     * "aguardando_medico", então ele
     * desaparecerá da fila de triagem.
     */

    carregarPacientes();

  })

  .catch(erro => {

    console.error(
      "Erro ao salvar triagem:",
      erro
    );

    alert(
      erro.message
    );

  });
}
function sair() {
  fetch("/logout", {
    method: "POST"
  })
  .then(() => {
    window.location.href = "index.html";
  });
}
// Carrega a fila ao abrir a página
carregarPacientes();
// Atualiza a lista automaticamente a cada 10 segundos
setInterval(carregarPacientes, 10000);
</script>
</body>
</html>
