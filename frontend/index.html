<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  
  <h2>Sistema Hospital</h2>
  
  <input id="usuario" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>
<script>
function login() {
  fetch("/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      usuario: document.getElementById("usuario").value,
      senha: document.getElementById("senha").value
    })
  })
  .then(async response => {
    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.erro || "Erro no login");
    }
    return data;
  })
  .then(data => {
    if (data.tipo === "admin") {
      location.href = "admin.html";
    }
    else if (data.tipo === "triagem") {
      location.href = "triagem.html";
    }
    else if (data.tipo === "medico") {
      location.href = "medico.html";
    }
    else if (data.tipo === "atendimento") {
      location.href = "atendimento.html";
    }
  })
  .catch(error => {
    alert(error.message);
  });
}
</script>
</body>
</html>
